<script>
const {
  useState,
  useEffect,
  useRef,
  useMemo,
  useCallback
} = React;
const SEVERITIES = {
  observation: {
    label: 'Observation',
    color: '#38bdf8',
    bg: '#0d2a3a'
  },
  minor: {
    label: 'Minor defect',
    color: '#fbbf24',
    bg: '#332708'
  },
  major: {
    label: 'Major defect',
    color: '#fb923c',
    bg: '#331c07'
  },
  hazard: {
    label: 'Safety hazard',
    color: '#ef4444',
    bg: '#350f0f'
  }
};
const SEV_ORDER = ['observation', 'minor', 'major', 'hazard'];
const MAX_PHOTOS = 3;
const MAX_W = 1024;
const JPEG_Q = 0.7;
const MAX_DOCS = 10;
const MAX_DOC_MB = 20;
const DB_NAME = 'snaglog-db',
  STORE = 'reports',
  DB_VER = 1;
function openDB() {
  return new Promise((res, rej) => {
    let r;
    try {
      r = indexedDB.open(DB_NAME, DB_VER);
    } catch (e) {
      return rej(e);
    }
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, {
        keyPath: 'id'
      });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbGetAll() {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readonly');
    const q = tx.objectStore(STORE).getAll();
    q.onsuccess = () => res(q.result || []);
    q.onerror = () => rej(q.error);
  });
}
async function idbPut(rep) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(rep);
    tx.oncomplete = () => res(true);
    tx.onerror = () => rej(tx.error);
  });
}
async function idbDel(id) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => res(true);
    tx.onerror = () => rej(tx.error);
  });
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const todayISO = () => new Date().toISOString().slice(0, 10);
const fmtDT = ts => {
  try {
    return new Date(ts).toLocaleString('en-GB');
  } catch (e) {
    return '';
  }
};
function blankReport() {
  return {
    id: uid(),
    meta: {
      projectName: '',
      date: todayISO(),
      inspector: '',
      contractor: '',
      client: ''
    },
    observations: [],
    documents: [],
    createdAt: Date.now(),
    updatedAt: Date.now()
  };
}
function fileToImage(file) {
  return new Promise((res, rej) => {
    if (!file || !file.type || !file.type.startsWith('image/')) return rej(new Error('Not an image file.'));
    const reader = new FileReader();
    reader.onerror = () => rej(new Error('Could not read the file.'));
    reader.onload = () => {
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = () => rej(new Error('Image data is corrupt or unsupported.'));
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function urlToImage(src) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => rej(new Error('Could not load photo for annotation.'));
    img.src = src;
  });
}
function fileToDataURL(file) {
  return new Promise((res, rej) => {
    if (!file) return rej(new Error('No file given.'));
    const reader = new FileReader();
    reader.onerror = () => rej(new Error('Could not read the file.'));
    reader.onload = () => res(reader.result);
    reader.readAsDataURL(file);
  });
}
function fmtBytes(n) {
  if (n == null) return '';
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1024 / 1024).toFixed(1) + ' MB';
}
function scaledDims(w, h) {
  if (w <= MAX_W) return {
    w,
    h
  };
  const r = MAX_W / w;
  return {
    w: Math.round(w * r),
    h: Math.round(h * r)
  };
}
function imageToDataURL(img) {
  const dims = scaledDims(img.naturalWidth || img.width, img.naturalHeight || img.height);
  const c = document.createElement('canvas');
  c.width = dims.w;
  c.height = dims.h;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0, dims.w, dims.h);
  return c.toDataURL('image/jpeg', JPEG_Q);
}
function toCSV(report) {
  const rows = [['#', 'Location / chainage', 'Latitude', 'Longitude', 'Severity', 'Description', 'Action required', 'Photos', 'Logged']];
  report.observations.forEach((o, i) => rows.push([i + 1, o.location || '', o.lat || '', o.lng || '', (SEVERITIES[o.severity] || {}).label || o.severity, o.description || '', o.action || '', (o.photos || []).length, fmtDT(o.createdAt)]));
  const esc = v => {
    const s = String(v == null ? '' : v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  return '﻿' + rows.map(r => r.map(esc).join(',')).join('\r\n');
}
async function saveFile(filename, blob, notify) {
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      const dl = await window.claude.use('downloads');
      if (dl) {
        const r = await dl.save({
          filename,
          data: blob
        });
        if (!r || r.status === 'saved') notify && notify('Saved ' + filename + '.', 'ok');
        return;
      }
    }
  } catch (e) {
    if (e && e.code === 'declined') return;
    notify && notify('Download failed: ' + (e && e.message || e), 'error');
    return;
  }
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      URL.revokeObjectURL(url);
      a.remove();
    }, 500);
  } catch (e) {
    notify && notify('Download not supported in this environment.', 'error');
  }
}
function mapTransform(observations) {
  const pts = observations.map((o, i) => ({
    o,
    n: i + 1
  })).filter(p => p.o.lat != null && p.o.lng != null && p.o.lat !== '' && p.o.lng !== '');
  if (!pts.length) return null;
  const lats = pts.map(p => +p.o.lat),
    lngs = pts.map(p => +p.o.lng);
  let minLa = Math.min(...lats),
    maxLa = Math.max(...lats),
    minLo = Math.min(...lngs),
    maxLo = Math.max(...lngs);
  const spanLa = maxLa - minLa || 0.0005,
    spanLo = maxLo - minLo || 0.0005;
  minLa -= spanLa * 0.15;
  maxLa += spanLa * 0.15;
  minLo -= spanLo * 0.15;
  maxLo += spanLo * 0.15;
  return {
    pts,
    minLa,
    maxLa,
    minLo,
    maxLo
  };
}
async function buildPDF(report, notify) {
  const {
    jsPDF
  } = window.jspdf || {};
  if (!jsPDF) {
    notify('PDF library failed to load (check network access to the CDN).', 'error');
    return null;
  }
  const allPhotos = [];
  report.observations.forEach(o => (o.photos || []).forEach(p => allPhotos.push(p)));
  const imgDims = {};
  await Promise.all(allPhotos.map(async src => {
    if (imgDims[src]) return;
    try {
      const img = await urlToImage(src);
      imgDims[src] = {
        w: img.naturalWidth || img.width,
        h: img.naturalHeight || img.height
      };
    } catch (e) {
      imgDims[src] = {
        w: 4,
        h: 3
      };
    }
  }));
  const doc = new jsPDF({
    unit: 'mm',
    format: 'a4'
  });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const margin = 14;
  const contentW = pageW - margin * 2;
  let y = margin;
  const ensure = need => {
    if (y + need > pageH - margin) {
      doc.addPage();
      y = margin;
    }
  };
  const m = report.meta;
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(18);
  doc.text('SITE INSPECTION & SNAG REPORT', margin, y + 6);
  y += 10;
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(11);
  doc.text(m.projectName || 'Untitled project', margin, y + 3);
  y += 9;
  const rows = [['Project', m.projectName || '—', 'Date', m.date || '—'], ['Inspector', m.inspector || '—', 'Contractor', m.contractor || '—'], ['Client', m.client || '—']];
  const labelW = 26,
    valW = contentW / 2 - labelW;
  const rowH = 7;
  doc.setFontSize(9);
  rows.forEach((r, ri) => {
    const ry = y + ri * rowH;
    let x = margin;
    const cols = r.length === 4 ? [labelW, valW, labelW, valW] : [labelW, contentW - labelW];
    r.forEach((cell, ci) => {
      doc.setDrawColor(0);
      doc.rect(x, ry, cols[ci], rowH);
      doc.setFont('helvetica', ci % 2 === 0 ? 'bold' : 'normal');
      const txt = doc.splitTextToSize(String(cell), cols[ci] - 3);
      doc.text(txt[0] || '', x + 1.5, ry + rowH / 2 + 1.2);
      x += cols[ci];
    });
  });
  y += rows.length * rowH + 8;
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(12);
  ensure(14);
  doc.text('Location plan', margin, y);
  y += 4;
  const mapH = 55;
  ensure(mapH + 4);
  doc.setDrawColor(0);
  doc.rect(margin, y, contentW, mapH);
  const tf = mapTransform(report.observations);
  if (!tf) {
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.text('No GPS-tagged observations recorded.', margin + 3, y + mapH / 2);
  } else {
    const X = lo => margin + (lo - tf.minLo) / (tf.maxLo - tf.minLo) * contentW;
    const Y = la => y + mapH - (la - tf.minLa) / (tf.maxLa - tf.minLa) * mapH;
    tf.pts.forEach(p => {
      const col = (SEVERITIES[p.o.severity] || {}).color || '#888888';
      const rgb = [parseInt(col.slice(1, 3), 16), parseInt(col.slice(3, 5), 16), parseInt(col.slice(5, 7), 16)];
      const cx = X(+p.o.lng),
        cy = Y(+p.o.lat);
      doc.setFillColor(rgb[0], rgb[1], rgb[2]);
      doc.setDrawColor(0);
      doc.circle(cx, cy, 3, 'FD');
      doc.setFontSize(8);
      doc.setFont('helvetica', 'bold');
      doc.setTextColor(0, 0, 0);
      doc.text(String(p.n), cx, cy + 1, {
        align: 'center'
      });
    });
  }
  doc.setTextColor(0, 0, 0);
  y += mapH + 10;
  ensure(10);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(12);
  doc.text(`Observations (${report.observations.length})`, margin, y);
  y += 6;
  if (!report.observations.length) {
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10);
    ensure(8);
    doc.text('No observations recorded.', margin, y);
    y += 8;
  }
  for (let i = 0; i < report.observations.length; i++) {
    const o = report.observations[i];
    const sev = SEVERITIES[o.severity] || {
      label: o.severity
    };
    doc.setFontSize(9);
    const descLines = doc.splitTextToSize(o.description || '—', contentW - 6);
    const actionLines = doc.splitTextToSize('Action required: ' + (o.action || '—'), contentW - 6);
    const coordLine = o.lat ? 1 : 0;
    const photos = (o.photos || []).slice(0, MAX_PHOTOS);
    const photoRowH = photos.length ? 34 : 0;
    const bodyH = (coordLine + descLines.length + actionLines.length) * 4.6 + 6 + photoRowH + (photos.length ? 4 : 0);
    const headH = 7;
    const blockH = headH + bodyH + 4;
    ensure(blockH + 4);
    const blockTop = y;
    doc.setDrawColor(0);
    doc.rect(margin, blockTop, contentW, blockH);
    doc.line(margin, blockTop + headH, margin + contentW, blockTop + headH);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(10);
    doc.text(`#${i + 1}`, margin + 2, blockTop + 5);
    doc.setFontSize(8);
    const rgb2 = (() => {
      const col = sev.color || '#888888';
      return [parseInt(col.slice(1, 3), 16), parseInt(col.slice(3, 5), 16), parseInt(col.slice(5, 7), 16)];
    })();
    doc.setDrawColor(rgb2[0], rgb2[1], rgb2[2]);
    doc.setLineWidth(0.5);
    doc.rect(margin + 12, blockTop + 1.6, doc.getTextWidth(sev.label) + 5, 4.2);
    doc.text(sev.label, margin + 14.5, blockTop + 4.5);
    doc.setLineWidth(0.2);
    doc.setDrawColor(0);
    doc.setFont('helvetica', 'normal');
    doc.text(String(o.location || ''), margin + 12 + doc.getTextWidth(sev.label) + 10, blockTop + 4.5);
    let by = blockTop + headH + 4;
    doc.setFontSize(8.5);
    if (o.lat) {
      doc.setFont('helvetica', 'bold');
      doc.text('Coords:', margin + 3, by);
      doc.setFont('helvetica', 'normal');
      doc.text(`${(+o.lat).toFixed(5)}, ${(+o.lng).toFixed(5)}`, margin + 17, by);
      by += 4.6;
    }
    doc.setFont('helvetica', 'bold');
    doc.text('Description:', margin + 3, by);
    doc.setFont('helvetica', 'normal');
    doc.text(descLines, margin + 3, by + 4.4);
    by += descLines.length * 4.6 + 1;
    doc.setFont('helvetica', 'normal');
    doc.text(actionLines, margin + 3, by + 3.6);
    by += actionLines.length * 4.6 + 2;
    if (photos.length) {
      const gap = 3;
      const pw = (contentW - 6 - gap * (photos.length - 1)) / photos.length;
      let px = margin + 3;
      for (const src of photos) {
        const dim = imgDims[src] || {
          w: 4,
          h: 3
        };
        const ph = Math.min(photoRowH, pw * (dim.h / dim.w));
        const drawW = ph * (dim.w / dim.h) > pw ? pw : ph * (dim.w / dim.h);

          doc.addImage(src, 'JPEG', px, by, drawW, drawH, undefined, 'FAST');

        doc.rect(px, by, drawW, drawH);

  }

    ensure(10);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11);
    doc.text(`Attached documents (${report.documents.length})`, margin, y);
    y += 5;
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    report.documents.forEach(d => {
      ensure(5);
      doc.text(`• ${d.name} (${fmtBytes(d.size)})`, margin + 2, y);
      y += 4.6;
    });
    y += 3;
  }
  ensure(34);
  y += 6;
  const sigW = contentW / 3 - 6;
  const sigY = y + 18;
  [['Inspector', m.inspector || ''], ['Contractor representative', ''], ['Client representative', '']].forEach((s, i) => {
    const sx = margin + i * (sigW + 9);
    doc.setDrawColor(0);
    doc.line(sx, sigY, sx + sigW, sigY);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8);
    doc.text(s[0] + (s[1] ? ': ' + s[1] : ''), sx, sigY + 4);
  });
  const pageCount = doc.internal.getNumberOfPages();
  for (let p = 1; p <= pageCount; p++) {
    doc.setPage(p);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(7.5);
    doc.setTextColor(110, 110, 110);
    doc.text(`Generated ${fmtDT(Date.now())}`, margin, pageH - 6);
    doc.text(`Page ${p} of ${pageCount}`, pageW - margin, pageH - 6, {
      align: 'right'
    });

  }

}
function useToast() {
  const [toast, setToast] = useState(null);
  const show = useCallback((msg, type = 'info') => {
    setToast({
      msg,
      type,
      id: uid()
    });
  }, []);
  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 4200);
    return () => clearTimeout(t);
  }, [toast]);
  const node = toast ? React.createElement("div", {
    className: "no-print",
    style: {
      position: 'fixed',
      left: '50%',
      bottom: 20,
      transform: 'translateX(-50%)',
      zIndex: 80
    }
  }, React.createElement("div", {
    className: "btn",
    style: {
      background: toast.type === 'error' ? '#3a1c1c' : toast.type === 'ok' ? '#173a26' : '#232a33',
      borderColor: toast.type === 'error' ? '#5c2b2b' : toast.type === 'ok' ? '#2b5c3f' : '#39424e',
      maxWidth: '90vw'
    }
  }, toast.msg)) : null;
  return [node, show];
}
function AnnotationModal({
  img,

  const lw = Math.max(3, Math.round(dims.w * 0.006));
  const drawStroke = (ctx, s) => {
    ctx.strokeStyle = '#ff2d2d';
