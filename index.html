const DB_NAME = 'snaglog-db',

function openDB() {
  return new Promise((res, rej) => {
    let r;
    try {
      r = indexedDB.open(DB_NAME, DB_VER);
    } catch (e) {
      return rej(e);
    }
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, {
        keyPath: 'id'
      });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbGetAll() {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readonly');
    const q = tx.objectStore(STORE).getAll();
    q.onsuccess = () => res(q.result || []);
    q.onerror = () => rej(q.error);
  });
}
async function idbPut(rep) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(rep);
    tx.oncomplete = () => res(true);

  });

function fileToImage(file) {
  return new Promise((res, rej) => {
    if (!file || !file.type || !file.type.startsWith('image/')) return rej(new Error('Not an image file.'));
    const reader = new FileReader();
    reader.onerror = () => rej(new Error('Could not read the file.'));
    reader.onload = () => {
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = () => rej(new Error('Image data is corrupt or unsupported.'));
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function urlToImage(src) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => rej(new Error('Could not load photo for annotation.'));
    img.src = src;
  });
}
function fileToDataURL(file) {
  return new Promise((res, rej) => {
    if (!file) return rej(new Error('No file given.'));
    const reader = new FileReader();
    reader.onerror = () => rej(new Error('Could not read the file.'));
    reader.onload = () => res(reader.result);
    reader.readAsDataURL(file);
  });
}
function fmtBytes(n) {
  if (n == null) return '';
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1024 / 1024).toFixed(1) + ' MB';
}
function scaledDims(w, h) {
  if (w <= MAX_W) return {
    w,
    h
  };
  const r = MAX_W / w;
  return {
    w: Math.round(w * r),
    h: Math.round(h * r)
  };
}
function imageToDataURL(img) {
  const dims = scaledDims(img.naturalWidth || img.width, img.naturalHeight || img.height);
  const c = document.createElement('canvas');
  c.width = dims.w;
  c.height = dims.h;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0, dims.w, dims.h);
  return c.toDataURL('image/jpeg', JPEG_Q);
}
function toCSV(report) {

  report.observations.forEach((o, i) => rows.push([i + 1, o.location || '', o.lat || '', o.lng || '', (SEVERITIES[o.severity] || {}).label || o.severity, o.description || '', o.action || '', (o.photos || []).length, fmtDT(o.createdAt)]));
  const esc = v => {

}
async function saveFile(filename, blob, notify) {
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      const dl = await window.claude.use('downloads');
      if (dl) {
        const r = await dl.save({
          filename,
          data: blob
        });
        if (!r || r.status === 'saved') notify && notify('Saved ' + filename + '.', 'ok');
        return;
      }
    }
  } catch (e) {
    if (e && e.code === 'declined') return;
    notify && notify('Download failed: ' + (e && e.message || e), 'error');
    return;
  }
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      URL.revokeObjectURL(url);
      a.remove();
    }, 500);
  } catch (e) {
    notify && notify('Download not supported in this environment.', 'error');
  }
}
function mapTransform(observations) {
  const pts = observations.map((o, i) => ({
    o,
    n: i + 1
  })).filter(p => p.o.lat != null && p.o.lng != null && p.o.lat !== '' && p.o.lng !== '');
  if (!pts.length) return null;
  const lats = pts.map(p => +p.o.lat),
    lngs = pts.map(p => +p.o.lng);
  let minLa = Math.min(...lats),
    maxLa = Math.max(...lats),
    minLo = Math.min(...lngs),
    maxLo = Math.max(...lngs);
  const spanLa = maxLa - minLa || 0.0005,
    spanLo = maxLo - minLo || 0.0005;
  minLa -= spanLa * 0.15;
  maxLa += spanLa * 0.15;
  minLo -= spanLo * 0.15;
  maxLo += spanLo * 0.15;
  return {
    pts,
    minLa,
    maxLa,
    minLo,
    maxLo
  };
}
const blobToDataURL = blob => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(r.result);
  r.onerror = () => rej(new Error('Could not read map image data.'));
  r.readAsDataURL(blob);
});
async function fetchEsriExport(service, bbox, w, h, transparent) {
  const url = 'https://server.arcgisonline.com/ArcGIS/rest/services/' + service + '/MapServer/export?bbox=' + bbox.join(',') + '&bboxSR=3857&imageSR=3857&size=' + w + ',' + h + '&format=' + (transparent ? 'png32' : 'jpg') + '&transparent=' + (transparent ? 'true' : 'false') + '&f=image';
  const res = await fetch(url);
  if (!res.ok) throw new Error('Map image request failed (' + res.status + ')');
  const blob = await res.blob();
  if (!blob.type.startsWith('image/')) {
    let m = '';
    try {
      m = JSON.parse(await blob.text()).error.message;
    } catch (e) {}
    throw new Error('map service error' + (m ? ': ' + m : ''));
  }
  return urlToImage(await blobToDataURL(blob));
}
function imageToDataURLMax(img, maxW, q) {
  const nw = img.naturalWidth || img.width,
    nh = img.naturalHeight || img.height;
  const r = nw > maxW ? maxW / nw : 1;
  const c = document.createElement('canvas');
  c.width = Math.round(nw * r);
  c.height = Math.round(nh * r);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}
async function captureLocalityView(map) {
  map.invalidateSize();
  const size = map.getSize();
  if (!size.x || !size.y) throw new Error('the map is not visible yet - wait a moment and try again');
  const sf = Math.max(1, Math.min(2, 1300 / size.x));
  const w = Math.round(size.x * sf),
    h = Math.round(size.y * sf);
  const b = map.getBounds();
  const crs = L.CRS.EPSG3857;
  const sw = crs.project(b.getSouthWest()),
    ne = crs.project(b.getNorthEast());
  const bbox = [sw.x, sw.y, ne.x, ne.y];
  const base = await fetchEsriExport('World_Imagery', bbox, w, h, false);
  let labels = null;
  try {
    labels = await fetchEsriExport('Reference/World_Boundaries_and_Places', bbox, w, h, true);
  } catch (e) {}
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const ctx = c.getContext('2d');
  ctx.drawImage(base, 0, 0, w, h);
  if (labels) ctx.drawImage(labels, 0, 0, w, h);
  const center = map.getCenter();
  const fs = Math.max(11, Math.round(w / 75));
  const halo = (text, x, y, align) => {
    ctx.font = 'bold ' + fs + 'px Arial, sans-serif';
    ctx.textAlign = align;
    ctx.lineWidth = Math.max(3, fs / 4);
    ctx.strokeStyle = 'rgba(0,0,0,.85)';
    ctx.strokeText(text, x, y);
    ctx.fillStyle = '#fff';
    ctx.fillText(text, x, y);
  };
  // scale bar (metres per pixel corrected for latitude)
  const mpp = (ne.x - sw.x) / w * Math.cos(center.lat * Math.PI / 180);
  const target = mpp * w / 5;
  const pow = Math.pow(10, Math.floor(Math.log10(target)));
  const nice = [1, 2, 5, 10].map(m => m * pow).filter(v => v <= target).pop() || pow;
  const barPx = nice / mpp;
  const bx = Math.round(fs * 1.2),
    by = h - Math.round(fs * 2.6);
  ctx.lineWidth = Math.max(4, fs / 3);
  ctx.strokeStyle = 'rgba(0,0,0,.85)';
  ctx.beginPath();
  ctx.moveTo(bx, by - fs * .5);
  ctx.lineTo(bx, by);
  ctx.lineTo(bx + barPx, by);
  ctx.lineTo(bx + barPx, by - fs * .5);
  ctx.stroke();
  ctx.lineWidth = Math.max(2, fs / 6);
  ctx.strokeStyle = '#fff';
  ctx.stroke();
  halo(nice >= 1000 ? nice / 1000 + ' km' : nice + ' m', bx, by - fs * .9, 'left');
  // north arrow
  const nx = w - Math.round(fs * 2.2),
    ny = Math.round(fs * 3.4);
  ctx.beginPath();
  ctx.moveTo(nx, ny - fs * 1.6);
  ctx.lineTo(nx - fs * .8, ny + fs * .5);
  ctx.lineTo(nx, ny);
  ctx.lineTo(nx + fs * .8, ny + fs * .5);
  ctx.closePath();
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.fill();
  ctx.stroke();
  halo('N', nx, ny - fs * 1.9, 'center');
  halo('Imagery © Esri, Maxar, Earthstar Geographics', w - Math.round(fs * .8), h - Math.round(fs * .8), 'right');
  return {
    image: c.toDataURL('image/jpeg', 0.85),
    center: {
      lat: center.lat,
      lng: center.lng
    },
    zoom: map.getZoom(),
    capturedAt: Date.now()
  };
}
async function fetchStaticMapImage(observations, w, h) {
  const tf = mapTransform(observations);
  if (!tf) return null;
  const bbox = [tf.minLo, tf.minLa, tf.maxLo, tf.maxLa].join(',');
  const url = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/export' + '?bbox=' + encodeURIComponent(bbox) + '&bboxSR=4326&imageSR=4326&size=' + w + ',' + h + '&format=png&transparent=false&f=image';
  const res = await fetch(url);
  if (!res.ok) throw new Error('Map image request failed (' + res.status + ')');
  const blob = await res.blob();
  const dataURL = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error('Could not read map image.'));
    reader.readAsDataURL(blob);
  });
  return {
    dataURL,
    tf
  };
}
async function buildPDF(report, notify) {
  const {
    jsPDF
  } = window.jspdf || {};
  if (!jsPDF) {
    notify('PDF library failed to load (check network access to the CDN).', 'error');
    return null;
  }
  let logoImg = null;
  try {
    logoImg = await urlToImage(COMPANY.logo);
  } catch (e) {}
  let mapImg = null;
  try {
    mapImg = await fetchStaticMapImage(report.observations, 1100, 330);
  } catch (e) {}
  let locImg = null;
  if (report.locality && report.locality.image) {
    try {
      locImg = await urlToImage(report.locality.image);
    } catch (e) {}
  }
  const allPhotos = [];
  report.observations.forEach(o => (o.photos || []).forEach(p => allPhotos.push(p)));

    if (imgDims[src]) return;
    try {
      const img = await urlToImage(src);
      imgDims[src] = {
        w: img.naturalWidth || img.width,
        h: img.naturalHeight || img.height
      };

      imgDims[src] = {
        w: 4,
        h: 3

  const pageH = doc.internal.pageSize.getHeight();
  const margin = 14;
  const contentW = pageW - margin * 2;
  let y = margin;
  const ensure = need => {
    if (y + need > pageH - margin) {
      doc.addPage();
      y = margin;
    }
  };
  const m = report.meta;
  let logoH = 0;
  if (logoImg) {
    const targetH = 16;
    const targetW = targetH * ((logoImg.naturalWidth || logoImg.width) / (logoImg.naturalHeight || logoImg.height));
    try {
      doc.addImage(logoImg, 'PNG', margin, y, targetW, targetH);
      logoH = targetH;
    } catch (e) {}
  }
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(10);
  doc.text(COMPANY.name, pageW - margin, y + 3, {
    align: 'right'
  });
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(8);
  let addrY = y + 7;
  COMPANY.addressLines.forEach(l => {
    doc.text(l, pageW - margin, addrY, {
      align: 'right'
    });
    addrY += 3.6;
  });
  doc.text('Tel: ' + COMPANY.tel, pageW - margin, addrY, {
    align: 'right'
  });
  y += Math.max(logoH, addrY - y) + 4;
  doc.setDrawColor(0);
  doc.setLineWidth(0.6);
  doc.line(margin, y, pageW - margin, y);
  doc.setLineWidth(0.2);
  y += 8;
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(18);
  doc.text('SITE INSPECTION & SNAG REPORT', margin, y);
  y += 8;
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(11);
  doc.text(m.projectName || 'Untitled project', margin, y);
  y += 8;
  const rows = [['Project', m.projectName || '—', 'Date', m.date || '—'], ['Inspector', m.inspector || '—', 'Contractor', m.contractor || '—'], ['Client', m.client || '—']];
  const labelW = 26,
    valW = contentW / 2 - labelW;
  const rowH = 7;
  doc.setFontSize(9);
  rows.forEach((r, ri) => {
    const ry = y + ri * rowH;
    let x = margin;
    const cols = r.length === 4 ? [labelW, valW, labelW, valW] : [labelW, contentW - labelW];
    r.forEach((cell, ci) => {
      doc.setDrawColor(0);
      doc.rect(x, ry, cols[ci], rowH);
      doc.setFont('helvetica', ci % 2 === 0 ? 'bold' : 'normal');
